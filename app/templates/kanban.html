<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {} },
  corePlugins: { preflight: false },
}
</script>
<style>
:root {
  --bg-page: 254 254 254;
  --text-primary: 28 32 36;
  --text-secondary: 96 100 108;
  --text-muted: 138 143 155;
  --border: 240 240 243;
  --bg-card: 254 254 254;
  --bg-surface: 245 245 247;
  --accent: 39 129 246;
  --accent-hover: 16 115 233;
  --accent-focus: 39 129 246 / 0.15;
  --red: 229 70 102;
  --amber: 255 197 61;
  --green: 18 165 148;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-page: 20 21 23;
    --text-primary: 237 238 240;
    --text-secondary: 96 100 108;
    --text-muted: 110 115 128;
    --border: 40 42 46;
    --bg-card: 28 29 32;
    --bg-surface: 34 35 38;
    --accent: 39 129 246;
    --accent-hover: 16 115 233;
    --accent-focus: 39 129 246 / 0.2;
    --red: 229 70 102;
    --amber: 255 197 61;
    --green: 18 165 148;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: rgb(var(--text-primary));
  background: rgb(var(--bg-page));
  -webkit-font-smoothing: antialiased;
}

.board, .column-body {
  scrollbar-width: none;
}
.board::-webkit-scrollbar,
.column-body::-webkit-scrollbar {
  display: none;
}

.kanban-header {
  background: rgb(var(--bg-page));
  border-bottom: 1px solid rgb(var(--border));
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.kanban-header select {
  font-size: 13px;
  padding: 5px 10px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--bg-card));
  color: rgb(var(--text-primary));
  outline: none;
  cursor: pointer;
  line-height: 1.4;
}
.kanban-header select:focus {
  border-color: rgb(var(--accent));
  box-shadow: 0 0 0 2px rgb(var(--accent-focus));
}

.kanban-header .btn {
  padding: 5px 12px;
  font-size: 13px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--bg-card));
  color: rgb(var(--text-secondary));
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  line-height: 1.4;
}
.kanban-header .btn:hover {
  background: rgb(var(--bg-surface));
  color: rgb(var(--text-primary));
}
.kanban-header .btn:active {
  background: rgb(var(--border));
}

.board {
  display: flex;
  gap: 12px;
  padding: 16px;
  overflow-x: auto;
  min-height: calc(100vh - 49px);
  align-items: flex-start;
}

.column {
  flex: 0 0 280px;
  max-width: 280px;
  background: rgb(var(--bg-surface));
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 82px);
}

.column-header {
  padding: 10px 12px 8px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: rgb(var(--text-secondary));
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgb(var(--border));
}

.column-header .count {
  font-weight: 400;
  font-size: 11px;
  color: rgb(var(--text-muted));
  background: rgb(var(--border));
  padding: 1px 7px;
  border-radius: 10px;
}

.column-body {
  padding: 8px;
  overflow-y: auto;
  flex: 1;
  min-height: 60px;
}

.column-body.drag-over {
  background: rgb(var(--accent) / 0.06);
  border-radius: 6px;
}

.card {
  background: rgb(var(--bg-card));
  border: 1px solid rgb(var(--border));
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: grab;
  transition: border-color 0.15s;
  position: relative;
}
.card:hover {
  border-color: rgb(var(--text-muted));
}
.card.dragging {
  opacity: 0.5;
  border-style: dashed;
}
.card:active { cursor: grabbing; }

.card-contact {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.card-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  background: rgb(var(--border));
  flex-shrink: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
  color: rgb(var(--text-muted));
}
.card-avatar img {
  width: 100%; height: 100%; object-fit: cover;
}
.card-name {
  font-size: 13px;
  font-weight: 500;
  color: rgb(var(--text-primary));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-message {
  font-size: 12px;
  color: rgb(var(--text-secondary));
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: 2px;
}
.card-time {
  font-size: 11px;
  color: rgb(var(--text-muted));
  margin-top: 4px;
}

.card-task {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 6px;
  padding: 3px 9px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  background: rgb(var(--amber) / 0.12);
  color: rgb(180 120 0);
  border: 1px solid rgb(var(--amber) / 0.25);
  max-width: 100%;
}
.card-task.overdue {
  background: rgb(var(--red) / 0.1);
  color: rgb(var(--red));
  border-color: rgb(var(--red) / 0.25);
}
.card-task-icon {
  flex-shrink: 0;
  font-size: 12px;
}
.card-task-date {
  white-space: nowrap;
}
.card-task-msg {
  display: none;
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  right: 0;
  background: rgb(var(--bg-card));
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 12px;
  color: rgb(var(--text-primary));
  line-height: 1.4;
  z-index: 20;
  box-shadow: 0 2px 8px rgb(0 0 0 / 0.1);
  word-break: break-word;
}
.card:hover .card-task-msg {
  display: block;
}

.empty-state {
  text-align: center;
  padding: 24px 12px;
  font-size: 13px;
  color: rgb(var(--text-muted));
}

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 49px);
  color: rgb(var(--text-muted));
  font-size: 14px;
}
.spinner {
  width: 20px; height: 20px;
  border: 2px solid rgb(var(--border));
  border-top-color: rgb(var(--accent));
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@keyframes toastIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.error-banner {
  background: rgb(var(--red) / 0.1);
  color: rgb(var(--red));
  border: 1px solid rgb(var(--red) / 0.2);
  border-radius: 6px;
  padding: 10px 14px;
  margin: 16px;
  font-size: 13px;
}

.link-remove {
  display: block;
  margin-top: 2px;
  padding: 0;
  border: none;
  background: none;
  color: rgb(var(--red));
  font-size: 12px;
  cursor: pointer;
}
.link-remove:hover { text-decoration: underline; }
.link-remove:disabled { opacity: 0.6; cursor: default; }

/* ── Adicionar contato ─────────────────────────────── */
.col-add {
  margin-left: auto;
  margin-right: 6px;
  border: none;
  background: transparent;
  color: inherit;
  opacity: 0.55;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 2px 6px;
  border-radius: 6px;
}
.col-add:hover { opacity: 1; background: rgba(127,127,127,.15); }
.add-search { width: 100%; box-sizing: border-box; }
.add-results {
  margin-top: 10px;
  max-height: 340px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.add-result {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid transparent;
}
.add-result:hover { background: rgba(127,127,127,.08); }
.add-result .card-avatar { flex-shrink: 0; }
.add-result-info { flex: 1; min-width: 0; }
.add-result-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.add-result-sub { font-size: 12px; opacity: 0.65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.add-result-stage {
  display: inline-block;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 10px;
  background: rgba(127,127,127,.15);
  margin-top: 2px;
}
.add-result button { flex-shrink: 0; padding: 4px 10px; font-size: 13px; }
.add-empty { padding: 16px 4px; text-align: center; opacity: 0.6; font-size: 13px; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgb(0 0 0 / 0.4);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.15s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: rgb(var(--bg-card));
  border: 1px solid rgb(var(--border));
  border-radius: 8px;
  width: 420px;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 64px);
  overflow-y: auto;
  animation: modalIn 0.15s ease-out;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
  border-bottom: 1px solid rgb(var(--border));
}
.modal-header h3 {
  font-size: 14px;
  font-weight: 600;
  color: rgb(var(--text-primary));
}
.modal-close {
  width: 28px;
  height: 28px;
  border: none;
  background: none;
  color: rgb(var(--text-muted));
  cursor: pointer;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  line-height: 1;
}
.modal-close:hover {
  background: rgb(var(--bg-surface));
  color: rgb(var(--text-primary));
}

.modal-body {
  padding: 16px;
}

.modal-contact {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.modal-contact .card-avatar {
  width: 32px;
  height: 32px;
  font-size: 13px;
}
.modal-contact .card-name {
  font-size: 14px;
}
.modal-contact a {
  font-size: 12px;
  color: rgb(var(--accent));
  text-decoration: none;
}
.modal-contact a:hover {
  text-decoration: underline;
}

.modal-field {
  margin-bottom: 12px;
}
.modal-field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: rgb(var(--text-secondary));
  margin-bottom: 4px;
}
.modal-field input,
.modal-field select,
.modal-field textarea {
  width: 100%;
  font-size: 13px;
  padding: 7px 10px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--bg-card));
  color: rgb(var(--text-primary));
  outline: none;
  font-family: inherit;
}
.modal-field input:focus,
.modal-field select:focus,
.modal-field textarea:focus {
  border-color: rgb(var(--accent));
  box-shadow: 0 0 0 2px rgb(var(--accent-focus));
}
.modal-field textarea {
  resize: vertical;
  min-height: 60px;
}

.modal-task-info {
  background: rgb(var(--bg-surface));
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 12px;
}
.modal-task-info .task-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 4px;
}
.modal-task-info .task-row:last-child {
  margin-bottom: 0;
}
.modal-task-info .task-label {
  color: rgb(var(--text-secondary));
}
.modal-task-info .task-value {
  color: rgb(var(--text-primary));
  font-weight: 500;
}

.modal-footer {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid rgb(var(--border));
  justify-content: flex-end;
}
.modal-footer .spacer {
  flex: 1;
}

.btn-primary {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  border: none;
  border-radius: 6px;
  background: rgb(var(--accent));
  color: #fff;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover {
  background: rgb(var(--accent-hover));
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-secondary {
  padding: 6px 14px;
  font-size: 13px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--bg-card));
  color: rgb(var(--text-secondary));
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.btn-secondary:hover {
  background: rgb(var(--bg-surface));
  color: rgb(var(--text-primary));
}

.btn-danger {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  border: none;
  border-radius: 6px;
  background: rgb(var(--red) / 0.1);
  color: rgb(var(--red));
  cursor: pointer;
  transition: background 0.15s;
}
.btn-danger:hover {
  background: rgb(var(--red) / 0.2);
}

.modal-task-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
</style>
</head>
<body>
<div id="app">
  <div class="loading"><div class="spinner"></div>Carregando quadro…</div>
</div>
<div id="task-modal-root"></div>

<script>
const API_CONFIG = '/kanban/config';
const API_BOARD = '/kanban/board';
const API_MOVE_STAGE = '/kanban/board';
const API_TASKS = '/kanban/tasks';

let chatwootUrl = '';
let chatwootAccountId = '';
let chatwootFrontendUrl = '';
let allColumns = [];
let activeFilter = '';
let currentModalCardId = null;
let pollingTimer = null;
let isTabVisible = true;
let lastGeneratedAt = null;
let pollInterval = 30000;
const MIN_POLL = 15000;
const MAX_POLL = 60000;

document.addEventListener('visibilitychange', () => {
  isTabVisible = !document.hidden;
  if (isTabVisible) refreshBoard();
});

const $ = (s, p) => (p || document).querySelector(s);
const $$ = (s, p) => [...(p || document).querySelectorAll(s)];

function timeAgo(dateStr) {
  if (!dateStr) return '';
  let d;
  if (typeof dateStr === 'number' || /^\d{10}(\.\d+)?$/.test(String(dateStr))) {
    d = new Date(Number(dateStr) * 1000);
  } else {
    d = new Date(dateStr);
  }
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const diff = now - d;
  if (diff < 0) return 'agora';
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'agora';
  if (mins < 60) return `há ${mins}min`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `há ${hrs}h`;
  const days = Math.floor(hrs / 24);
  return `há ${days}d`;
}

function initials(name) {
  if (!name) return '?';
  return name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function computeTaskEstado(task) {
  if (!task) return null;
  if (task.estado === 'tarea_cerrada') {
    if (!task.cerrado_en) return 'tarea_cerrada';
    const cerrado = new Date(task.cerrado_en);
    const ahora = new Date();
    if (ahora - cerrado < 24 * 60 * 60 * 1000) return 'tarea_cerrada';
    return null;
  }
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const vence = new Date(task.fecha_vencimiento);
  vence.setHours(0, 0, 0, 0);
  const diffMs = vence - hoy;
  const diffDias = diffMs / (1000 * 60 * 60 * 24);
  if (diffDias < 0) return 'tarea_vencida';
  if (diffDias === 0) return 'tarea_hoy';
  return 'tarea_activa';
}

function renderTaskBadge(task) {
  if (!task) return '';
  const estado = computeTaskEstado(task);
  if (!estado) return '';
  const isOverdue = estado === 'tarea_vencida';
  const cls = isOverdue ? 'card-task overdue' : 'card-task';
  const dateStr = task.fecha_vencimiento
    ? new Date(task.fecha_vencimiento).toLocaleDateString('pt-BR')
    : '';
  const msg = task.mensaje ? escapeHtml(task.mensaje) : '';
  return `
    <div class="${cls}" title="${msg}">
      <span class="card-task-icon">&#128197;</span>
      ${dateStr ? `<span class="card-task-date">${dateStr}</span>` : ''}
      ${msg ? `<div class="card-task-msg">${msg}</div>` : ''}
    </div>
  `;
}

async function loadConfig() {
  const res = await fetch(API_CONFIG);
  const data = await res.json();
  chatwootUrl = data.chatwoot_url || '';
  chatwootAccountId = data.chatwoot_account_id || '';
  chatwootFrontendUrl = data.chatwoot_frontend_url || '';
  allColumns = data.columns || [];
  return data;
}

async function loadBoard(stage) {
  const url = stage ? `${API_BOARD}?stage=${encodeURIComponent(stage)}` : API_BOARD;
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) {
    const msg = data.detail || `HTTP ${res.status}`;
    throw new Error(msg);
  }
  chatwootAccountId = data.chatwoot_account_id || chatwootAccountId;
  return data;
}

function openContact(id) {
  if (!id) return;
  const base = (chatwootFrontendUrl || chatwootUrl).replace(/\/+$/, '');
  const url = chatwootAccountId
    ? `${base}/app/accounts/${chatwootAccountId}/contacts/${id}`
    : '';
  if (url) window.open(url, '_blank');
}

function openTaskModal(cardData) {
  currentModalCardId = cardData.id;
  stopPolling();
  const task = cardData.task || null;
  const root = document.getElementById('task-modal-root');

  const taskColors = {
    tarea_activa: { bg: 'rgb(var(--accent) / 0.1)', text: 'rgb(var(--accent))' },
    tarea_hoy: { bg: 'rgb(var(--amber) / 0.15)', text: 'rgb(180 120 0)' },
    tarea_vencida: { bg: 'rgb(var(--red) / 0.1)', text: 'rgb(var(--red))' },
    tarea_cerrada: { bg: 'rgb(var(--text-muted) / 0.15)', text: 'rgb(var(--text-secondary))' },
  };
  const taskLabels = {
    tarea_activa: 'Ativa',
    tarea_hoy: 'Vence hoje',
    tarea_vencida: 'Vencida',
    tarea_cerrada: 'Concluída',
  };

  const base = (chatwootFrontendUrl || chatwootUrl).replace(/\/+$/, '');
  const chatwootLink = chatwootAccountId
    ? `${base}/app/accounts/${chatwootAccountId}/contacts/${cardData.id}`
    : '';

  let taskSection = '';
  if (task) {
    const computedEstado = computeTaskEstado(task);
    const tc = taskColors[computedEstado] || taskColors.tarea_activa;
    const tl = taskLabels[computedEstado] || computedEstado;
    const isClosed = computedEstado === 'tarea_cerrada';
    const fechaDisplay = task.fecha_vencimiento
      ? new Date(task.fecha_vencimiento).toLocaleDateString('pt-BR')
      : '—';
    taskSection = `
      <div class="modal-task-info">
        <div class="task-row">
          <span class="task-label">Status</span>
          <span class="modal-task-status" style="background:${tc.bg};color:${tc.text}">${tl}</span>
        </div>
        <div class="task-row">
          <span class="task-label">Mensagem</span>
          <span class="task-value">${escapeHtml(task.mensaje)}</span>
        </div>
        <div class="task-row">
          <span class="task-label">Vencimento</span>
          <span class="task-value">${fechaDisplay}</span>
        </div>
        <div class="task-row">
          <span class="task-label">Criada por</span>
          <span class="task-value">${escapeHtml(task.creado_por || '—')}</span>
        </div>
      </div>
      ${isClosed ? '' : `
        <div class="modal-field">
          <label for="task-msg">Mensagem</label>
          <textarea id="task-msg" rows="2">${escapeHtml(task.mensaje)}</textarea>
        </div>
        <div class="modal-field">
          <label for="task-date">Vencimento</label>
          <input type="date" id="task-date" value="${task.fecha_vencimiento || ''}">
        </div>
      `}
    `;
  } else {
    taskSection = `
      <div class="modal-field">
        <label for="task-msg">Descrição da tarefa</label>
        <textarea id="task-msg" rows="2" placeholder="Ex.: Enviar proposta comercial"></textarea>
      </div>
      <div class="modal-field">
        <label for="task-date">Data de vencimento</label>
        <input type="date" id="task-date">
      </div>
    `;
  }

  const computedEstado = task ? computeTaskEstado(task) : null;
  const taskStatus = task && computedEstado
    ? `<span class="modal-task-status" style="background:${(taskColors[computedEstado] || taskColors.tarea_activa).bg};color:${(taskColors[computedEstado] || taskColors.tarea_activa).text}">${taskLabels[computedEstado] || computedEstado}</span>`
    : '<span style="font-size:12px;color:rgb(var(--text-muted))">Sem tarefa</span>';

  let footerButtons = '';
  if (task && computedEstado && computedEstado !== 'tarea_cerrada') {
    footerButtons = `
      <button class="btn-danger" id="modal-close-task">Concluir tarefa</button>
      <div class="spacer"></div>
      <button class="btn-secondary" id="modal-cancel">Cancelar</button>
      <button class="btn-primary" id="modal-save">Salvar</button>
    `;
  } else if (task && computedEstado === 'tarea_cerrada') {
    footerButtons = `
      <div class="spacer"></div>
      <button class="btn-secondary" id="modal-cancel">Fechar</button>
    `;
  } else {
    footerButtons = `
      <div class="spacer"></div>
      <button class="btn-secondary" id="modal-cancel">Cancelar</button>
      <button class="btn-primary" id="modal-create">Criar tarefa</button>
    `;
  }

  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3>${escapeHtml(cardData.contact_name || 'Conversa')}</h3>
          <button class="modal-close" id="modal-close-x">&times;</button>
        </div>
        <div class="modal-body">
          <div class="modal-contact">
            <div class="card-avatar">${cardData.thumbnail ? `<img src="${cardData.thumbnail}" alt="">` : initials(cardData.contact_name)}</div>
            <div>
              <div class="card-name">${escapeHtml(cardData.contact_name)}</div>
              <a href="${chatwootLink}" target="_blank" rel="noopener">Ver contato</a>
              <button type="button" class="link-remove" id="modal-remove-contact">Remover do kanban</button>
            </div>
          </div>
          <div style="margin-bottom:12px">
            <span style="font-size:12px;font-weight:500;color:rgb(var(--text-secondary))">Tarefa: </span>${taskStatus}
          </div>
          ${taskSection}
        </div>
        <div class="modal-footer">
          ${footerButtons}
        </div>
      </div>
    </div>
  `;

  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeTaskModal();
  });
  document.getElementById('modal-close-x').addEventListener('click', closeTaskModal);
  document.getElementById('modal-cancel')?.addEventListener('click', closeTaskModal);
  document.getElementById('modal-remove-contact')
    .addEventListener('click', (e) => removeFromBoard(cardData, e.currentTarget));

  if (task && computedEstado && computedEstado !== 'tarea_cerrada') {
    document.getElementById('modal-save')?.addEventListener('click', () => saveTask(task.id));
    document.getElementById('modal-close-task')?.addEventListener('click', () => closeTaskAction(task.id));
  } else if (!task) {
    document.getElementById('modal-create')?.addEventListener('click', () => createTask(cardData.id));
  }
}

// ── Remover do kanban ────────────────────────────────
async function removeFromBoard(cardData, btn) {
  // Primeiro clique pede confirmação; o segundo remove.
  if (btn.dataset.confirm !== '1') {
    btn.dataset.confirm = '1';
    btn.textContent = 'Clique de novo para confirmar';
    setTimeout(() => {
      if (btn.isConnected && btn.dataset.confirm === '1') {
        btn.dataset.confirm = '';
        btn.textContent = 'Remover do kanban';
      }
    }, 4000);
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Removendo…';
  try {
    const res = await fetch(`${API_MOVE_STAGE}/${cardData.id}/stage`, { method: 'DELETE' });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `HTTP ${res.status}`);
    document.querySelector(`.card[data-contact-id="${cardData.id}"]`)?.remove();
    updateCounts();
    closeTaskModal();
    showToast(`${cardData.contact_name || 'Contato'} removido do kanban`, 'success');
  } catch (err) {
    btn.disabled = false;
    btn.dataset.confirm = '';
    btn.textContent = 'Remover do kanban';
    showToast(`Erro ao remover: ${err.message}`, 'error');
  }
}

// ── Adicionar contato ─────────────────────────────────
const API_CONTACT_SEARCH = '/kanban/contacts/search';
let addSearchTimer = null;
let addSearchSeq = 0;

function openAddContactModal(defaultStage) {
  const stages = allColumns.length
    ? allColumns
    : $$('.column').map(c => c.dataset.stage);
  const selected = defaultStage || stages[0] || '';
  const root = document.getElementById('task-modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3>Adicionar contato ao kanban</h3>
          <button class="modal-close" id="modal-close-x">&times;</button>
        </div>
        <div class="modal-body">
          <div class="modal-field">
            <label>Etapa</label>
            <select id="add-stage">
              ${stages.map(st => `<option value="${escapeHtml(st)}" ${st === selected ? 'selected' : ''}>${escapeHtml(st)}</option>`).join('')}
            </select>
          </div>
          <div class="modal-field">
            <label>Buscar contato</label>
            <input type="search" id="add-search" class="add-search" placeholder="Nome, telefone ou e-mail" autocomplete="off">
          </div>
          <div class="add-results" id="add-results"><div class="add-empty">Carregando…</div></div>
        </div>
      </div>
    </div>`;

  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') closeTaskModal();
  });
  document.getElementById('modal-close-x').addEventListener('click', closeTaskModal);
  const input = document.getElementById('add-search');
  input.addEventListener('input', () => {
    clearTimeout(addSearchTimer);
    addSearchTimer = setTimeout(() => runContactSearch(input.value), 300);
  });
  input.focus();
  runContactSearch('');
}

async function runContactSearch(q) {
  const list = document.getElementById('add-results');
  if (!list) return;
  const seq = ++addSearchSeq;
  list.innerHTML = '<div class="add-empty">Buscando…</div>';
  try {
    const res = await fetch(`${API_CONTACT_SEARCH}?q=${encodeURIComponent(q.trim())}`);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `HTTP ${res.status}`);
    const data = await res.json();
    if (seq !== addSearchSeq) return; // resposta antiga, ignora
    renderContactResults(data.contacts || [], q.trim());
  } catch (err) {
    if (seq !== addSearchSeq) return;
    list.innerHTML = `<div class="add-empty">Erro ao buscar: ${escapeHtml(err.message)}</div>`;
  }
}

function renderContactResults(contacts, q) {
  const list = document.getElementById('add-results');
  if (!list) return;
  if (!contacts.length) {
    list.innerHTML = `<div class="add-empty">${q ? 'Nenhum contato encontrado.' : 'Ainda não há contatos.'}</div>`;
    return;
  }
  list.innerHTML = '';
  contacts.forEach(c => {
    const name = c.name || c.phone_number || c.email || `#${c.id}`;
    const sub = [c.phone_number, c.email].filter(Boolean).join(' · ');
    const row = document.createElement('div');
    row.className = 'add-result';
    row.innerHTML = `
      <div class="card-avatar">${c.thumbnail ? `<img src="${escapeHtml(c.thumbnail)}" alt="">` : escapeHtml(initials(name))}</div>
      <div class="add-result-info">
        <div class="add-result-name">${escapeHtml(name)}</div>
        ${sub ? `<div class="add-result-sub">${escapeHtml(sub)}</div>` : ''}
        ${c.stage ? `<span class="add-result-stage">Em: ${escapeHtml(c.stage)}</span>` : ''}
      </div>
      <button class="btn-primary">${c.stage ? 'Mover' : 'Adicionar'}</button>`;
    row.querySelector('button').addEventListener('click', (e) => addContactToStage(c, name, e.currentTarget));
    list.appendChild(row);
  });
}

async function addContactToStage(contact, name, btn) {
  const stage = document.getElementById('add-stage')?.value;
  if (!stage) { showToast('Escolha uma etapa', 'error'); return; }
  if (contact.stage === stage) { showToast(`${name} já está em ${stage}`, 'info'); return; }
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch(`${API_MOVE_STAGE}/${contact.id}/stage`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stage }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `HTTP ${res.status}`);
    contact.stage = stage;
    btn.textContent = '✓';
    showToast(`${name} adicionado a ${stage}`, 'success');
    refreshBoard();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = contact.stage ? 'Mover' : 'Adicionar';
    showToast(`Erro: ${err.message}`, 'error');
  }
}

function closeTaskModal() {
  document.getElementById('task-modal-root').innerHTML = '';
  currentModalCardId = null;
  startPolling();
}

function optimisticTaskUpdate(contactId, taskData) {
  const card = document.querySelector(`.card[data-contact-id="${contactId}"]`);
  if (!card) return;
  card.dataset.task = JSON.stringify(taskData);
  const badge = card.querySelector('.card-task');
  if (badge) badge.remove();
  const badgeHTML = renderTaskBadge(taskData);
  if (badgeHTML) {
    const timeEl = card.querySelector('.card-time');
    if (timeEl) {
      timeEl.insertAdjacentHTML('beforebegin', badgeHTML);
    }
  }
}

async function createTask(contactId) {
  const msg = document.getElementById('task-msg')?.value?.trim();
  const date = document.getElementById('task-date')?.value;
  if (!msg) { showToast('Escreva a descrição da tarefa', 'error'); return; }
  if (!date) { showToast('Selecione uma data de vencimento', 'error'); return; }

  const btn = document.getElementById('modal-create');
  if (btn) { btn.disabled = true; btn.textContent = 'Criando…'; }

  optimisticTaskUpdate(contactId, {
    id: null,
    estado: 'tarea_activa',
    mensaje: msg,
    fecha_vencimiento: date,
    creado_por: '',
  });
  closeTaskModal();

  try {
    const res = await fetch(API_TASKS, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contact_id: contactId, mensaje: msg, fecha_vencimiento: date }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    showToast(data.action === 'updated' ? 'Tarefa atualizada' : 'Tarefa criada');
  } catch (err) {
    showToast(`Erro: ${err.message}`, 'error');
    refreshBoard();
  }
}

async function saveTask(taskId) {
  const msg = document.getElementById('task-msg')?.value?.trim();
  const date = document.getElementById('task-date')?.value;
  if (!msg) { showToast('Escreva a descrição da tarefa', 'error'); return; }
  if (!date) { showToast('Selecione uma data de vencimento', 'error'); return; }

  const btn = document.getElementById('modal-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando…'; }

  optimisticTaskUpdate(currentModalCardId, {
    id: taskId,
    estado: 'tarea_activa',
    mensaje: msg,
    fecha_vencimiento: date,
    creado_por: '',
  });
  closeTaskModal();

  try {
    const res = await fetch(`${API_TASKS}/${taskId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje: msg, fecha_vencimiento: date }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    showToast('Tarefa atualizada');
  } catch (err) {
    showToast(`Erro: ${err.message}`, 'error');
    refreshBoard();
  }
}

async function closeTaskAction(taskId) {
  const btn = document.getElementById('modal-close-task');
  if (btn) { btn.disabled = true; btn.textContent = 'Concluindo…'; }

  optimisticTaskUpdate(currentModalCardId, null);
  closeTaskModal();

  try {
    const res = await fetch(`${API_TASKS}/${taskId}/close`, { method: 'PATCH' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    showToast('Tarefa concluída');
  } catch (err) {
    showToast(`Erro: ${err.message}`, 'error');
    refreshBoard();
  }
}

function resetStateFilter() {
  const sel = document.getElementById('state-filter');
  if (sel) sel.value = '';
}

function renderBoard(data) {
  const columns = data.columns || [];
  const app = document.getElementById('app');

  if (columns.length === 0) {
    app.innerHTML = `<div class="error-banner">Nenhuma coluna configurada. Verifique se o atributo personalizado <strong>pipeline_01_etapas</strong> existe no Chatwoot.</div>`;
    return;
  }

  app.innerHTML = `
    <div class="kanban-header">
      <select id="pipeline-select">
        <option value="">Todas as etapas</option>
        ${columns.map(c => `<option value="${c.stage}">${c.stage}</option>`).join('')}
      </select>
      <select id="state-filter">
        <option value="">Todas as tarefas</option>
        <option value="tarea_activa">Ativa</option>
        <option value="tarea_hoy">Vence hoje</option>
        <option value="tarea_vencida">Vencida</option>
        <option value="tarea_cerrada">Concluída</option>
        <option value="sin_tarea">Sem tarefa</option>
      </select>
      <button class="btn" id="add-contact-btn">+ Adicionar contato</button>
      <button class="btn" id="refresh-btn">Atualizar</button>
      <a href="/kanban/dashboard" class="btn">Dashboard</a>
    </div>
    <div class="board" id="board"></div>
  `;

  document.getElementById('pipeline-select').addEventListener('change', () => {
    activeFilter = '';
    document.getElementById('state-filter').value = '';
    refreshBoard();
  });
  document.getElementById('state-filter').addEventListener('change', () => {
    refreshBoard();
  });
  document.getElementById('refresh-btn').addEventListener('click', () => refreshBoard());
  document.getElementById('add-contact-btn').addEventListener('click', () => openAddContactModal());

  const board = document.getElementById('board');
  renderColumns(columns, board);
}

async function refreshBoard() {
  const stage = document.getElementById('pipeline-select')?.value;
  const taskFilter = document.getElementById('state-filter')?.value;
  activeFilter = taskFilter;

  const board = document.getElementById('board');
  board.innerHTML = `<div class="loading" style="min-height:200px"><div class="spinner"></div>Carregando…</div>`;

  try {
    const data = await loadBoard(stage || undefined);
    lastGeneratedAt = data.generated_at || null;
    renderColumns(data.columns || [], board);
  } catch (err) {
    const isChatwoot = err.message.includes('Chatwoot');
    const hint = isChatwoot
      ? 'Verifique se o Chatwoot está acessível e se o token do bot é válido.'
      : 'Veja os logs do container para mais detalhes.';
    board.innerHTML = `<div class="error-banner"><strong>Erro:</strong> ${escapeHtml(err.message)}<br><small>${hint}</small></div>`;
  }
}

function renderColumns(columns, board) {
  board.innerHTML = '';
  columns.forEach(col => {
    let cards = col.contacts || [];
    if (activeFilter) {
      cards = cards.filter(c => {
        const estado = computeTaskEstado(c.task);
        if (activeFilter === 'sin_tarea') return !estado;
        return estado === activeFilter;
      });
    }

    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.stage = col.stage;
    colEl.innerHTML = `
      <div class="column-header">
        <span>${col.stage}</span>
        <button class="col-add" title="Adicionar contato a esta etapa">+</button>
        <span class="count">${cards.length}</span>
      </div>
      <div class="column-body" data-stage="${col.stage}"></div>
    `;

    colEl.querySelector('.col-add').addEventListener('click', () => openAddContactModal(col.stage));

    const body = colEl.querySelector('.column-body');
    cards.forEach(card => {
      body.appendChild(createCard(card));
    });

    setupDropZone(body, col.stage);
    board.appendChild(colEl);
  });
}

function createCard(card) {
  const el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.dataset.contactId = card.id;
  el.dataset.customAttributes = JSON.stringify(card.custom_attributes || {});
  if (card.task) el.dataset.task = JSON.stringify(card.task);

  el.innerHTML = `
    <div class="card-contact">
      <div class="card-avatar">${card.thumbnail ? `<img src="${card.thumbnail}" alt="">` : initials(card.contact_name)}</div>
      <div class="card-name">${card.contact_name}</div>
    </div>
    ${card.task ? renderTaskBadge(card.task) : ''}
    <div class="card-time">${timeAgo(card.last_activity_at)}</div>
  `;

  el.addEventListener('dragstart', (e) => {
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', JSON.stringify({
      id: card.id,
      stage: el.closest('.column').dataset.stage,
    }));
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));

  el.addEventListener('click', () => {
    openTaskModal({
      id: card.id,
      contact_name: card.contact_name,
      thumbnail: card.thumbnail,
      task: card.task || null,
    });
  });

  return el;
}

function setupDropZone(body, targetStage) {
  body.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    body.classList.add('drag-over');
  });
  body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
  body.addEventListener('drop', async (e) => {
    e.preventDefault();
    body.classList.remove('drag-over');
    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
    if (data.stage === targetStage) return;

    const draggable = document.querySelector(`.card[data-contact-id="${data.id}"]`);
    if (!draggable) return;

    const originalStage = draggable.closest('.column').dataset.stage;

    try {
      const res = await fetch(`${API_MOVE_STAGE}/${data.id}/stage`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage: targetStage }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: 'Erro desconhecido' }));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      draggable.remove();
      const targetBody = document.querySelector(`.column-body[data-stage="${targetStage}"]`);
      if (targetBody) {
        const cardData = {
          id: data.id,
          contact_name: draggable.querySelector('.card-name')?.textContent || '',
          thumbnail: draggable.querySelector('img')?.src || '',
          last_activity_at: new Date().toISOString(),
          custom_attributes: JSON.parse(draggable.dataset.customAttributes || '{}'),
          task: draggable.dataset.task ? JSON.parse(draggable.dataset.task) : null,
        };
        targetBody.insertBefore(createCard(cardData), targetBody.firstChild);
      }
      updateCounts();
    } catch (err) {
      console.error('Drop failed:', err);
      showToast(`Erro ao mover: ${err.message}`, 'error');
    }
  });
}

function updateCounts() {
  $$('.column').forEach(col => {
    const count = col.querySelectorAll('.card').length;
    const badge = col.querySelector('.count');
    if (badge) badge.textContent = count;
  });
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function showToast(message, type = 'info') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.style.cssText = `
    position: fixed; bottom: 16px; right: 16px; z-index: 100;
    padding: 10px 16px; border-radius: 6px; font-size: 13px;
    color: #fff; max-width: 340px; word-break: break-word;
    animation: toastIn 0.2s ease-out;
  `;
  toast.style.background = type === 'error'
    ? 'rgb(var(--red))'
    : 'rgb(var(--green))';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

function startPolling() {
  stopPolling();
  lastGeneratedAt = null;
  pollInterval = MIN_POLL;
  scheduleNextPoll();
}

function scheduleNextPoll() {
  pollingTimer = setTimeout(async () => {
    if (!isTabVisible || currentModalCardId) {
      scheduleNextPoll();
      return;
    }
    try {
      const stage = document.getElementById('pipeline-select')?.value;
      const data = await loadBoard(stage || undefined);
      const changed = !data.generated_at || data.generated_at !== lastGeneratedAt;
      if (changed) {
        lastGeneratedAt = data.generated_at || null;
        const board = document.getElementById('board');
        renderColumns(data.columns || [], board);
        pollInterval = MIN_POLL;
      } else {
        pollInterval = Math.min(pollInterval + 10000, MAX_POLL);
      }
    } catch (err) {
      console.error('Polling refresh failed:', err);
    }
    scheduleNextPoll();
  }, pollInterval);
}

function stopPolling() {
  if (pollingTimer) {
    clearTimeout(pollingTimer);
    pollingTimer = null;
  }
}

async function init() {
  try {
    const config = await loadConfig();
    const data = await loadBoard();
    lastGeneratedAt = data.generated_at || null;
    renderBoard(data);
    startPolling();
  } catch (err) {
    const detail = err.message || 'Erro desconhecido';
    document.getElementById('app').innerHTML =
      `<div class="error-banner"><strong>Erro ao iniciar o quadro:</strong> ${escapeHtml(detail)}<br><small> veja <code>/kanban/debug-status</code> para diagnóstico.</small></div>`;
  }
}

init();
</script>
